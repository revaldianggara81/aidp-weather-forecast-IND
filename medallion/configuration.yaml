forecasting:
  test_days: 30        # days held out for model evaluation
  forecast_days: 30    # days to forecast into the future
  context_days: 60     # days of history shown in plots

features:
  lags: [1, 7, 14, 30]        # lag sizes (in days) for each target variable
  rolling_windows: [7, 14, 30] # window sizes (in days) for rolling mean/std

lgbm:
  n_estimators: 500
  learning_rate: 0.05
  num_leaves: 31
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 5
  min_child_samples: 10
  random_state: 42

prophet:
  seasonality_mode: additive   # additive or multiplicative
  yearly_seasonality: true
  weekly_seasonality: true
  daily_seasonality: false
  changepoint_prior_scale: 0.05

nhits:
  input_size: 60      # lookback window in days (2x forecast horizon)
  max_steps: 500
  learning_rate: 0.001
  batch_size: 32
  random_seed: 42

lstm:
  input_size: 60      # lookback window in days
  hidden_size: 128
  num_layers: 2
  dropout: 0.2
  learning_rate: 0.001
  epochs: 100
  batch_size: 32

lstm_attn:
  input_size: 60          # lookback window in days
  hidden_size: 128
  num_layers: 2
  dropout: 0.2
  learning_rate: 0.001
  epochs: 200             # more epochs (early stopping will cut short)
  batch_size: 32
  n_heads: 4              # multi-head attention heads
  attention_dropout: 0.1
  early_stop_patience: 15 # epochs without val improvement before stopping
  gradient_clip: 1.0      # max gradient norm

ensemble:
  ridge_alpha: 1.0    # L2 regularisation strength for the Ridge meta-model

tft:
  input_size: 60      # lookback window in days
  hidden_size: 64     # model dimension (smaller = faster training)
  n_head: 4           # number of attention heads
  dropout: 0.1
  max_steps: 500
  learning_rate: 0.001
  batch_size: 32
  random_seed: 42

ar_lstm:
  input_size: 60      # lookback window in days
  hidden_size: 128
  num_layers: 2
  dropout: 0.2
  learning_rate: 0.001
  epochs: 100
  batch_size: 32
