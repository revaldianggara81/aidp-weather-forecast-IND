services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aidp-weather-web
    env_file:
      - ./frontend/.env.local
    environment:
      NODE_ENV: production
    expose:
      - "3000"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: aidp-weather-nginx
    ports:
      - "9333:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    restart: unless-stopped
