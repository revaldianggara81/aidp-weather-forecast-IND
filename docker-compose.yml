services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: aidp-india-web
    container_name: aidp-india-weather-forecast
    # Delta Sharing credentials aren't created yet (India share is still being
    # set up in AIDP), so this file is optional. Data pages stay empty until
    # frontend/.env.local is created from frontend/.env.local.example.
    env_file:
      - path: ./frontend/.env.local
        required: false
    environment:
      NODE_ENV: production
    expose:
      - "3000"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: aidp-india-weather-nginx
    ports:
      - "9334:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    restart: unless-stopped
